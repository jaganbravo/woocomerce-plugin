<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Fighter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            border: 4px solid #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        canvas {
            display: block;
            background: linear-gradient(to bottom, #87ceeb 0%, #4a90e2 50%, #2e5c8a 100%);
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }
        
        #healthBar {
            width: 200px;
            height: 30px;
            border: 3px solid #000;
            background: #8b0000;
            margin-top: 10px;
        }
        
        #healthFill {
            height: 100%;
            background: #00ff00;
            width: 100%;
            transition: width 0.3s;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border: 2px solid #000;
        }
        
        #characterSelect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(74, 144, 226, 0.95);
            border: 4px solid #000;
            padding: 30px;
            z-index: 200;
            text-align: center;
            min-width: 400px;
        }
        
        #characterSelect h1 {
            color: #000;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        #characterInfo {
            background: rgba(255,255,255,0.9);
            border: 3px solid #000;
            padding: 20px;
            margin: 20px 0;
        }
        
        #characterInfo h2 {
            color: #000;
            margin-bottom: 10px;
        }
        
        #characterInfo p {
            color: #333;
            margin: 5px 0;
        }
        
        button {
            background: #2e5c8a;
            color: white;
            border: 3px solid #000;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        
        button:hover {
            background: #357abd;
        }
        
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <div id="ui" style="display: none;">
            <div>Health</div>
            <div id="healthBar">
                <div id="healthFill"></div>
            </div>
        </div>
        <div id="controls" style="display: none;">
            <strong>Controls:</strong><br>
            A/← Move Left | D/→ Move Right<br>
            Space/W Jump | X Attack | Z Special
        </div>
        <div id="characterSelect">
            <h1>SELECT PIRATE</h1>
            <div id="characterInfo">
                <h2 id="charName">Blackbeard</h2>
                <p id="charStats">Health: 150 | Speed: 200 | Attack: 25 | Special: 50</p>
            </div>
            <div>
                <button onclick="prevCharacter()">◀ PREV</button>
                <button onclick="selectCharacter()">SELECT</button>
                <button onclick="nextCharacter()">NEXT ▶</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
